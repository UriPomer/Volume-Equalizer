<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>音量均衡 · 设置</title>
    <link rel="stylesheet" href="options.css">
    <script src="options.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <span class="logo" aria-hidden="true">EQ</span>
        <div><h1>音量均衡</h1><p>让不同视频，保持舒适音量。</p></div>
      </header>
      <form aria-label="音量均衡设置" aria-busy="true">
        <label class="master row">
          <span><strong>启用音量均衡</strong><small>控制所有平台的音量处理</small></span>
          <input id="enabled" type="checkbox" role="switch" disabled>
        </label>
        <section aria-labelledby="platform-title">
          <h2 id="platform-title">应用平台</h2>
          <p class="description">选择需要自动均衡音量的网站。</p>
          <div class="platforms">
            <label class="row">
              <span class="badge bili" aria-hidden="true">B</span>
              <span class="name"><strong>bilibili</strong><small>哔哩哔哩及其子域名</small></span>
              <input id="bilibiliEnabled" type="checkbox" role="switch" disabled>
            </label>
            <label class="row">
              <span class="badge youtube" aria-hidden="true">▶</span>
              <span class="name"><strong>YouTube</strong><small>含隐私增强嵌入播放器</small></span>
              <input id="youtubeEnabled" type="checkbox" role="switch" disabled>
            </label>
            <label class="row">
              <span class="badge other" aria-hidden="true">◎</span>
              <span class="name"><strong>其他网页</strong><small>其他网站的视频与音频</small></span>
              <input id="otherEnabled" type="checkbox" role="switch" disabled>
            </label>
          </div>
        </section>
      </form>
      <p class="note">关闭后播放原始音频。直播默认关闭，可在网页内手动开启。</p>
      <footer><span id="status" role="status" aria-live="polite">正在加载设置…</span><button id="retry" type="button" hidden>重试</button></footer>
    </main>
  </body>
</html>
