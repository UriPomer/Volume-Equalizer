name: Release Extension

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      expected-tag: ${{ github.ref_name }}

  publish:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: extension-package
          path: package

      - name: Verify package checksum before publishing
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.package-sha256 }}
        shell: pwsh
        run: |
          $zip = "package/bili-volume-eq-v$env:VERSION.zip"
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          if ($actual -ne $env:EXPECTED_SHA256) { throw 'Verified release package checksum mismatch' }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ needs.verify.outputs.version }}
          files: package/bili-volume-eq-v${{ needs.verify.outputs.version }}.zip
          fail_on_unmatched_files: true
