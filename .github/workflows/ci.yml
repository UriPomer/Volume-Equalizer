name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit and integration tests
        run: npm run test:unit

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download audio fixtures
        run: npm run test:audio:download

      - name: Enforce audio quality
        run: npm run test:audio:enforce

      - name: Build
        run: npm run build

      - name: Browser audio safety E2E
        run: node scripts/test-browser-audio.mjs
        env:
          VOLUME_EQ_ARTIFACT_ROOT: ${{ runner.temp }}

      - name: Realtime media and panel E2E
        run: node scripts/test-realtime-browser.mjs
        env:
          VOLUME_EQ_ARTIFACT_ROOT: ${{ runner.temp }}

      - name: Upload audio verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-verification
          path: |
            test-results/
            ${{ runner.temp }}/volume-eq-ceiling-*/
            ${{ runner.temp }}/volume-eq-realtime-*/
